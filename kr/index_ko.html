<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 명언</title>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column; /* 제목과 카드를 세로로 배치 */
        }
        .site-title {
            font-size: 2.2rem;
            color: #2c3e50;
            margin-bottom: 20px;
            font-weight: 800;
            letter-spacing: -1px;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        .image-container {
            width: 100%;
            height: 250px;
            background-color: #ddd;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .quote {
            font-size: 1.4rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
            word-break: keep-all;
        }
        .author {
            font-size: 1rem;
            color: #777;
            margin-bottom: 25px;
        }
        .btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <!-- 웹사이트 메인 제목 -->
    <h1 class="site-title">✨ 오늘의 명언</h1>

    <div class="card">
        <!-- 한글 버전 전용 이미지 -->
        <div class="image-container">
            <img src="/kr/korean.jpg" alt="오늘의 명언 이미지">
        </div>
        
        <div class="quote" id="quote-text">"기회는 일어나는 것이 아니라 만드는 것이다."</div>
        <div class="author" id="quote-author">- 크리스 그로서</div>
        
        <button class="btn" onclick="getRandomQuote()">다른 명언 보기</button>
    </div>

    <script>
        const quotes = [
            { text: "“기회는 일어나는 것이 아니라 만드는 것이다.”", author: "크리스 그로서" },
            { text: "“당신이 할 수 있다고 믿든 할 수 없다고 믿든, 당신의 말은 옳다.”", author: "헨리 포드" },
            { text: "“어제보다 나은 내일을 만드는 것은 오늘의 노력이다.”", author: "미상" }
        ];

        function getRandomQuote() {
            const randomIndex = Math.floor(Math.random() * quotes.length);
            const selected = quotes[randomIndex];
            
            document.getElementById('quote-text').innerText = selected.text;
            document.getElementById('quote-author').innerText = `- ${selected.author}`;
        }

        window.onload = getRandomQuote;
    </script>
</body>
</html>
