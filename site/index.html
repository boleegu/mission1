<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘 점심 뭐 먹지</title>
  <style>
    :root {
      /* 배포 버전을 눈으로 구분하려면 간판 색만 바꾸세요. 예: v3는 #1F7A4D */
      --sign: #FF6B00;
      --navy: #14213D;
      --danmuji: #FFD23F;
      --gim: #1F7A4D;
      --steel: #E1E6EA;
      --white: #FFFFFF;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--steel); color: var(--navy); line-height: 1.5;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    }
    header { background: var(--sign); color: var(--white); border-bottom: 8px solid var(--navy); }
    .bar { max-width: 1000px; margin: 0 auto; padding: 22px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; }
    h1 { margin: 0; flex: 1 1 260px; font-size: 2.7rem; font-weight: 900; letter-spacing: -0.03em; line-height: 1.15; }
    .chip { padding: 4px 14px; border-radius: 8px; background: var(--navy); color: var(--danmuji); font-weight: 800; }
    main { max-width: 1000px; margin: 0 auto; padding: 36px 20px 56px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 40px; align-items: center; }
    .wheel { position: relative; max-width: 460px; width: 100%; margin: 0 auto; }
    .wheel::before {
      content: ""; position: absolute; z-index: 1; top: -6px; left: 50%; margin-left: -20px;
      border: 20px solid transparent; border-top: 36px solid var(--navy); border-bottom: 0;
    }
    canvas { display: block; width: 100%; height: auto; }
    .order { min-width: 0; }
    .order p { margin: 0; }
    .pick { font-size: 3.2rem; font-weight: 900; letter-spacing: -0.03em; line-height: 1.15; min-height: 2.3em; overflow-wrap: anywhere; }
    .word { margin-top: 10px; font-size: 1.15rem; min-height: 3.4em; }
    .buttons { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; }
    button {
      font: inherit; font-size: 1.15rem; font-weight: 800; cursor: pointer;
      padding: 14px 24px; border: 4px solid var(--navy); border-radius: 12px;
      background: var(--danmuji); color: var(--navy);
    }
    #eat { background: var(--gim); color: var(--white); }
    button:hover { filter: brightness(1.06); }
    button:focus-visible { outline: 4px solid var(--sign); outline-offset: 3px; }
    button:disabled { opacity: 0.5; cursor: default; }
    button[hidden] { display: none; }
    .photo { display: block; width: 100%; max-width: 380px; height: auto; margin-top: 24px; border: 4px solid var(--navy); border-radius: 12px; }
    footer { max-width: 1000px; margin: 0 auto; padding: 0 20px 40px; font-weight: 600; }
    @media (max-width: 760px) {
      h1 { font-size: 2rem; }
      main { grid-template-columns: 1fr; gap: 24px; padding-top: 28px; }
      .pick { font-size: 2.4rem; min-height: 0; }
      .word { min-height: 0; }
    }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <h1>오.점.뭐("오늘 점심 뭐 먹지"라는 뜻)</h1>
      <span class="chip" id="chip">v2</span>
    </div>
  </header>

  <main>
    <div class="wheel">
      <canvas id="wheel" width="720" height="720" role="img" aria-label="점심 메뉴 룰렛"></canvas>
    </div>
    <div class="order" aria-live="polite">
      <p class="pick" id="pick">돌려 보세요</p>
      <p class="word" id="word">고민은 룰렛이 대신합니다. 결과에 대한 책임은 지지 않습니다.</p>
      <div class="buttons">
        <button type="button" id="spin">룰렛 돌리기</button>
        <button type="button" id="eat" hidden>이걸로 먹기</button>
      </div>
      <img class="photo" src="images/lunch.png" alt="맛있는 것 먹자고 오늘" width="800" height="629">
    </div>
  </main>

  <footer>이 식당은 18시에 문을 닫습니다. 서버가 퇴근하거든요.</footer>

  <script>
    var VERSION = "v2";

    var menu = [
      ["김치찌개", "실패한 적이 없는 선택입니다."],
      ["제육볶음", "직장인 점심의 기본값입니다."],
      ["돈까스", "오늘은 왠지 돈까스가 맞습니다."],
      ["칼국수", "국물이 필요한 날이네요."],
      ["비빔밥", "고민될 땐 다 넣고 비비면 됩니다."],
      ["짜장면", "짬뽕 생각은 잠시 접어 두세요."],
      ["국밥", "든든하게 가는 겁니다."],
      ["쌀국수", "고수는 취향껏 넣으세요."],
      ["굿푸드", "가장 무난합니다."],
      ["햄버거", "감자튀김은 큰 걸로 하세요."],
      ["마라탕", "오후에 회의가 없길 바랍니다."],
      ["샐러드", "룰렛도 가끔은 양심이 있습니다."]
    ];
    var sulk = [
      "",
      "방금 것도 괜찮았는데요.",
      "세 번째입니다. 룰렛에게도 감정이 있습니다.",
      "대충 돌렸습니다. 성의는 기대하지 마세요."
    ];
    var paint = [["#FF6B00", "#FFFFFF"], ["#FFD23F", "#14213D"], ["#1F7A4D", "#FFFFFF"], ["#FFFFFF", "#14213D"]];

    var canvas = document.getElementById("wheel");
    var ctx = canvas.getContext("2d");
    var pick = document.getElementById("pick");
    var word = document.getElementById("word");
    var spinButton = document.getElementById("spin");
    var eatButton = document.getElementById("eat");
    var calm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    var labels = menu.map(function (m) { return m[0]; });
    var slice = 2 * Math.PI / labels.length;
    var angle = 0;
    var spins = 0;
    var mood = 0;
    var begged = false;
    var first = "";
    var busy = false;

    function face() {
      ctx.fillStyle = "#FFFFFF";
      ctx.strokeStyle = "#14213D";
      ctx.lineWidth = 10;
      ctx.lineCap = "round";
      ctx.beginPath(); ctx.arc(360, 360, 84, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#14213D";
      ctx.beginPath(); ctx.arc(332, 346, 9, 0, 2 * Math.PI); ctx.arc(388, 346, 9, 0, 2 * Math.PI); ctx.fill();
      ctx.lineWidth = 8;
      ctx.beginPath();
      if (mood === 0) {
        ctx.arc(360, 368, 28, 0.15 * Math.PI, 0.85 * Math.PI);
      } else if (mood === 1) {
        ctx.moveTo(338, 392); ctx.lineTo(382, 392);
      } else {
        ctx.arc(360, 412, 26, 1.2 * Math.PI, 1.8 * Math.PI);
      }
      if (mood >= 3) {
        ctx.moveTo(314, 318); ctx.lineTo(346, 330);
        ctx.moveTo(406, 318); ctx.lineTo(374, 330);
      }
      ctx.stroke();
    }

    function draw() {
      ctx.clearRect(0, 0, 720, 720);
      ctx.lineJoin = "round";
      for (var i = 0; i < labels.length; i++) {
        var from = angle + i * slice;
        ctx.beginPath();
        ctx.moveTo(360, 360);
        ctx.arc(360, 360, 340, from, from + slice);
        ctx.closePath();
        ctx.fillStyle = paint[i % 4][0];
        ctx.fill();
        ctx.save();
        ctx.translate(360, 360);
        ctx.rotate(from + slice / 2);
        ctx.fillStyle = paint[i % 4][1];
        ctx.font = "800 " + (labels[i].length > 4 ? 27 : 33) + "px 'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif";
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        ctx.fillText(labels[i], 318, 0);
        ctx.restore();
      }
      ctx.strokeStyle = "#14213D";
      ctx.lineWidth = 14;
      ctx.beginPath(); ctx.arc(360, 360, 340, 0, 2 * Math.PI); ctx.stroke();
      face();
    }

    function finish(index, round) {
      busy = false;
      spins += 1;
      mood = Math.min(round, 3);
      pick.textContent = labels[index];
      if (round === 0) {
        first = labels[index];
        word.textContent = menu[index][1];
      } else if (round < 4) {
        word.textContent = sulk[round];
      } else {
        word.textContent = "칸을 전부 " + first + " 칸으로 바꿨습니다. 처음에 나온 그 메뉴입니다.";
      }
      spinButton.disabled = false;
      spinButton.textContent = "다시 돌리기";
      eatButton.hidden = false;
      draw();
    }

    function spin() {
      if (busy) { return; }
      var round = spins;
      if (round >= 4 && !begged) {
        begged = true;
        mood = 3;
        word.textContent = "싫습니다. 정중하게 부탁하면 생각해 보겠습니다.";
        spinButton.textContent = "돌려 주세요, 룰렛님";
        draw();
        return;
      }
      if (round >= 4) {
        labels = labels.map(function () { return first; });
      }
      busy = true;
      spinButton.disabled = true;
      eatButton.hidden = true;
      var index = Math.floor(Math.random() * labels.length);
      var lazy = round === 3;
      var start = angle;
      var rest = -Math.PI / 2 - (index + 0.5) * slice;
      var gap = ((rest - start) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
      var end = start + gap + 2 * Math.PI * (lazy ? 1 : 5);
      var time = calm ? 0 : lazy ? 1400 : 4200;
      var began = performance.now();
      function tick(now) {
        var t = time ? Math.min((now - began) / time, 1) : 1;
        angle = start + (end - start) * (1 - Math.pow(1 - t, 3));
        draw();
        if (t < 1) { requestAnimationFrame(tick); } else { finish(index, round); }
      }
      requestAnimationFrame(tick);
    }

    function eat() {
      word.textContent = "결정했습니다. 맛있게 드세요. 룰렛은 기분이 풀렸습니다.";
      labels = menu.map(function (m) { return m[0]; });
      spins = 0;
      mood = 0;
      begged = false;
      eatButton.hidden = true;
      spinButton.textContent = "룰렛 돌리기";
      draw();
    }

    spinButton.addEventListener("click", spin);
    eatButton.addEventListener("click", eat);
    draw();

    // 빌드 단계가 만든 version.txt(커밋 ID)가 있으면 버전 옆에 보여 줍니다.
    var chip = document.getElementById("chip");
    chip.textContent = VERSION;
    fetch("version.txt").then(function (r) {
      return r.ok ? r.text() : "";
    }).then(function (t) {
      t = t.trim();
      if (/^[0-9a-f]{7,40}$/.test(t)) { chip.textContent = VERSION + " " + t.slice(0, 7); }
    }).catch(function () {});
  </script>
</body>
</html>
