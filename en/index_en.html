<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Today's Word</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column; /* 세로 배치 */
        }
        .site-title {
            font-size: 2.2rem;
            color: #2c3e50;
            margin-bottom: 20px;
            font-weight: 800;
            letter-spacing: -1px;
        }
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .tab-btn {
            border: none;
            background: #e0e0e0;
            color: #555;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.3s, color 0.3s;
        }
        .tab-btn.active {
            background: #2c3e50;
            color: white;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        .image-container {
            width: 100%;
            height: 250px;
            background-color: #ddd;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .quote {
            font-size: 1.4rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        .author {
            font-size: 1rem;
            color: #777;
            margin-bottom: 25px;
        }
        .btn {
            background-color: #007BFF;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <!-- 웹사이트 메인 제목 -->
    <h1 class="site-title">💡 Today's Word 💡</h1>

    <!-- Quote / Fortune toggle tabs -->
    <div class="tabs">
        <button class="tab-btn active" id="tab-quote" onclick="setMode('quote')">Quote</button>
        <button class="tab-btn" id="tab-fortune" onclick="setMode('fortune')">Fortune</button>
    </div>

    <div class="card">
        <!-- 영어 버전 전용 이미지 -->
        <div class="image-container">
            <img src="/en/english.jpg" alt="Today's Word Image">
        </div>
        
        <div class="quote" id="quote-text">"Opportunities don't happen, you create them."</div>
        <div class="author" id="quote-author">- Chris Grosser</div>
        
        <button class="btn" onclick="getRandom()">Next</button>
    </div>

    <script>
        const quotes = [
            { text: "“Opportunities don't happen, you create them.”", author: "Chris Grosser" },
            { text: "“Whether you think you can or you think you can't, you're right.”", author: "Henry Ford" },
            { text: "“The only way to do great work is to love what you do.”", author: "Steve Jobs" }
        ];

        const fortunes = [
            { text: "“An unexpected good news is on its way to you today.”", author: "Fortune" },
            { text: "“A small act of courage brings big luck.”", author: "Fortune" },
            { text: "“Smile first, and luck will follow.”", author: "Fortune" },
            { text: "“No need to rush today, good things come naturally.”", author: "Fortune" },
            { text: "“A calm mind sees more opportunities.”", author: "Fortune" }
        ];

        let currentMode = 'quote';

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('tab-quote').classList.toggle('active', mode === 'quote');
            document.getElementById('tab-fortune').classList.toggle('active', mode === 'fortune');
            getRandom();
        }

        function getRandom() {
            const source = currentMode === 'quote' ? quotes : fortunes;
            const randomIndex = Math.floor(Math.random() * source.length);
            const selected = source[randomIndex];

            document.getElementById('quote-text').innerText = selected.text;
            document.getElementById('quote-author').innerText = `- ${selected.author}`;
        }

        window.onload = getRandom;
    </script>
</body>
</html>
